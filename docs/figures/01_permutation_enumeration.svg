<circle cx="84" cy="0" r="4" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<text class="th" x="120" y="4" fill="#412402">The mirror image</text>
<text class="ts" x="0" y="28">Maximally different from real labels —</text>
<text class="ts" x="0" y="42">opposite sign, similar magnitude</text>
</g>

<rect x="60" y="330" width="560" height="100" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="80" y="358" fill="#2C2C2A">Why this matters</text>
<text class="ts" x="80" y="380">The real labels appear as one of the 35 permutations during enumeration. When the loop hits them,</text>
<text class="ts" x="80" y="396">edgeR runs on the actual data and returns the observed p-values — contributing obs_hits/35 to the null mean.</text>
<text class="ts" x="80" y="412">By test symmetry, the mirror image contributes a similar amount. That gives a hard floor on empirical FDR</text>
<text class="ts" x="80" y="428">of roughly 2/35 ≈ 5.7% — independent of how strong the signal is.</text>
</svg>
