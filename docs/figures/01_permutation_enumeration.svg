<g transform="translate(360, 250)">
<rect x="-10" y="-10" width="120" height="20" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<circle cx="0"  cy="0" r="4" fill="none" stroke="#BA7517" stroke-width="1.2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#BA7517" stroke-width="1.2"/><circle cx="28" cy="0" r="4" fill="none" stroke="#BA7517" stroke-width="1.2"/>
